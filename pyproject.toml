[project]
name = "memory-center"
version = "4.3.93"
description = "Memory Center is an MCP-native project memory service and multi-agent shared context center for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Memory Center Contributors" }
]
keywords = [
  "mcp", "model-context-protocol", "ai-agent", "coding-agent", "spring-cloud",
  "project-memory", "multi-agent", "java", "devtools", "memory-center", "code-indexing", "knowledge-graph", "impact-analysis"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.1.7",
  "pyyaml>=6.0.1",
  "filelock>=3.13.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0,<2.0.0"]
semantic = ["litellm>=1.40.0"]
semantic-local = ["sentence-transformers>=3.0.0"]
semantic-ann = ["hnswlib>=0.8.0", "numpy>=1.24.0"]
ast = ["tree-sitter>=0.25,<0.26", "tree-sitter-java>=0.23,<0.24"]
architecture = ["igraph>=0.11,<2"]
multilang = [
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-kotlin>=1.1,<2.0",
  "igraph>=0.11,<2",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "build>=1.2.1",
  "twine>=5.1.0",
  "tomli>=2.0.1; python_version < '3.11'",
]
all = [
  "mcp>=1.2.0,<2.0.0",
  "litellm>=1.40.0",
  "sentence-transformers>=3.0.0",
  "hnswlib>=0.8.0",
  "numpy>=1.24.0",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-kotlin>=1.1,<2.0",
]

[project.urls]
Homepage = "https://github.com/fsrmqi/memory-center"
Documentation = "https://github.com/fsrmqi/memory-center/tree/main/docs"
Issues = "https://github.com/fsrmqi/memory-center/issues"
Source = "https://github.com/fsrmqi/memory-center"

[project.scripts]
memory-center = "memory_center.cli.main:main"
memory-center-mcp = "memory_center.mcp.server:main"
memory-center-http = "memory_center.http.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memory_center*"]

[tool.setuptools.package-data]
memory_center = ["hooks/*.yaml", "templates/**/*.md", "templates/**/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
