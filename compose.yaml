services:
  memory-center:
    build: .
    image: memory-center:5.0.0b6
    environment:
      MEMORY_CENTER_AUTH_MODE: ${MEMORY_CENTER_AUTH_MODE:-local}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - memory-center-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
volumes:
  memory-center-data:
