name: Feature request
description: Suggest an improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Memory Center to do?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Sample Java annotations, workspace layout, or expected MCP output.
