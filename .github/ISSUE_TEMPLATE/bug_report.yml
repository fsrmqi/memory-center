name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, minimal workspace.yaml, and command output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: memory-center 0.2.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, MCP client, Spring Cloud stack if relevant.
