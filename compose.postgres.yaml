# 标准部署：PG + pgvector；不读取或导入 SQLite catalog。
services:
  memory-center:
    environment:
      MEMORY_CENTER_DATABASE_URL: postgresql://memory:${MEMORY_CENTER_DB_PASSWORD:?请设置数据库密码}@postgres:5432/memory
      MEMORY_CENTER_MODEL_API_KEY: ${MEMORY_CENTER_MODEL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: memory
      POSTGRES_DB: memory
      POSTGRES_PASSWORD: ${MEMORY_CENTER_DB_PASSWORD:?请设置数据库密码}
    volumes:
      - memory-center-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  memory-center-postgres:
