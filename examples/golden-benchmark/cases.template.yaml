schema_version: 1
cases:
  - case_id: replace-with-stable-id
    query: com.example.service.DemoService#run
    mode: walkthrough
    expected_anchors:
      - DemoService#run
      - DemoController#list
      - DemoServiceImpl#list
    expected_edges:
      - CALLS_METHOD
      - IMPLEMENTS_FEIGN
      - HANDLES_ENDPOINT
    forbidden_anchors:
      - WrongController#list
    max_latency_ms: 5000

  # Impact analysis: use project when a class name exists in multiple modules.
  - case_id: replace-with-impact-id
    query: DemoService
    mode: impact
    project: demo-service
    expected_anchors:
      - DemoService#run
      - DemoController#list
    expected_edges: []
    forbidden_anchors:
      - WrongController#list
    max_latency_ms: 5000

  # Architecture context: validates service boundary evidence.
  - case_id: replace-with-context-id
    query: DemoService
    mode: context
    project: demo-service
    expected_anchors:
      - DemoService#run
      - DemoClient#request
    expected_edges:
      - CALLS_METHOD
      - INJECTS_BEAN
    forbidden_anchors:
      - WrongController#list
    max_latency_ms: 5000
